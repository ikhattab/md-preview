<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="mdfor.work — A fast, private markdown editor with instant live preview. Your content stays on your device and is never sent anywhere."
    />
    <meta
      name="keywords"
      content="markdown, preview, editor, live, real-time, writing, documentation, mdfor.work"
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="mdfor.work — Instant Markdown Editor" />
    <meta
      property="og:description"
      content="A fast, private markdown editor with instant live preview. Your content stays on your device and is never sent anywhere."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mdfor.work/" />
    <link rel="canonical" href="https://mdfor.work/" />
    <meta property="og:site_name" content="mdfor.work" />
    <meta property="og:image" content="https://mdfor.work/og-image.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mdfor.work — Instant Markdown Editor" />
    <meta
      name="twitter:description"
      content="A fast, private markdown editor with instant live preview. Your content stays on your device and is never sent anywhere."
    />
    <meta name="twitter:image" content="https://mdfor.work/og-image.png" />

    <title>mdfor.work — Instant Markdown Editor</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)" />

    <script type="module" src="/app.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "mdfor.work",
        "url": "https://mdfor.work/",
        "description": "A fast, private markdown editor with instant live preview. Content stays on your device and is never sent anywhere.",
        "applicationCategory": "Productivity",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <div class="app">
      <header class="header">
        <div class="logo-container">
          <svg
            class="logo-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
            <polyline points="14 2 14 8 20 8" />
            <path d="M9 13v-1h6v1" />
            <path d="M12 12v6" />
            <path d="M11 18h2" />
          </svg>
          <h1 class="logo">mdfor.work</h1>
        </div>

        <div class="header-controls" role="group" aria-label="Editor controls">
          <nav class="mobile-view-switcher" id="mobileViewSwitcher" aria-label="Toggle view">
            <button class="view-tab active" data-view="editor" aria-pressed="true" data-tooltip="Editor">
              <i data-lucide="pencil" width="16" height="16" aria-hidden="true"></i>
              <span class="view-tab-label">Editor</span>
            </button>
            <button class="view-tab" data-view="preview" aria-pressed="false" data-tooltip="Preview">
              <i data-lucide="eye" width="16" height="16" aria-hidden="true"></i>
              <span class="view-tab-label">Preview</span>
            </button>
          </nav>
          <button
            class="scroll-sync-toggle"
            id="scrollSyncToggle"
            aria-label="Toggle scroll sync"
            title="Sync scrolling (off)"
            data-tooltip="Sync scrolling (off)"
            aria-pressed="false"
          >
            <i
              data-lucide="link"
              class="sync-icon synced-icon"
              width="18"
              height="18"
              aria-hidden="true"
            ></i>
            <i
              data-lucide="unlink"
              class="sync-icon unsynced-icon"
              width="18"
              height="18"
              aria-hidden="true"
            ></i>
          </button>
          <button
            class="lint-toggle"
            id="lintToggle"
            aria-label="Toggle markdown linting"
            title="Lint markdown (off)"
            data-tooltip="Lint markdown (off)"
            aria-pressed="false"
          >
            <i
              data-lucide="triangle-alert"
              class="lint-icon"
              width="18"
              height="18"
              aria-hidden="true"
            ></i>
            <span class="lint-count" id="lintCount" aria-live="polite"></span>
          </button>
          <div class="file-actions" role="group" aria-label="File actions">
            <button type="button" class="file-action-btn" id="importBtn">Import</button>
            <div class="export-menu" id="exportMenu">
              <button
                type="button"
                class="file-action-btn file-action-btn-primary export-menu-trigger"
                id="exportMenuBtn"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="exportMenuPopover"
              >
                Export
                <i
                  data-lucide="chevron-down"
                  class="export-menu-chevron"
                  width="14"
                  height="14"
                  aria-hidden="true"
                ></i>
              </button>
              <div class="export-menu-popover" id="exportMenuPopover" role="menu" hidden>
                <button type="button" class="export-menu-item" role="menuitem" id="exportMdBtn">
                  Download .md
                </button>
                <button type="button" class="export-menu-item" role="menuitem" id="exportHtmlBtn">
                  Download .html
                </button>
              </div>
            </div>
            <input
              type="file"
              id="importFileInput"
              class="sr-only"
              accept=".md,.markdown,.txt,text/markdown,text/plain"
              tabindex="-1"
            />
          </div>
          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle theme"
            title="Toggle theme"
            data-tooltip="Toggle theme"
          >
            <i
              data-lucide="sun"
              class="theme-icon light-icon"
              width="20"
              height="20"
              aria-hidden="true"
            ></i>
            <i
              data-lucide="moon"
              class="theme-icon dark-icon"
              width="20"
              height="20"
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </header>

      <main class="editor-container" id="mainContent">
        <section class="pane editor-pane" id="editorPane" aria-labelledby="editorHeading">
          <header class="pane-header">
            <h2 class="pane-title" id="editorHeading">Markdown</h2>
            <button
              class="collapse-btn"
              id="collapseEditor"
              aria-label="Collapse editor"
              title="Collapse editor"
              data-tooltip="Collapse editor"
            >
              <i
                data-lucide="chevron-left"
                class="collapse-icon"
                width="16"
                height="16"
                aria-hidden="true"
              ></i>
            </button>
          </header>
          <div class="lint-panel" id="lintPanel" aria-live="polite" role="log">
            <ul class="lint-list" id="lintList"></ul>
          </div>
          <div class="field">
            <label class="sr-only" for="editor">Markdown input</label>
            <p class="sr-only" id="editorDescription">
              Type markdown to see a live preview alongside.
            </p>
            <div class="editor-wrapper">
              <div class="line-gutter" id="lineGutter" aria-hidden="true"></div>
              <textarea
                id="editor"
                class="editor"
                placeholder="Start writing..."
                spellcheck="true"
                aria-describedby="editorDescription"
              ></textarea>
            </div>
          </div>
        </section>

        <div
          class="resize-handle"
          id="resizeHandle"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize editor and preview panes"
          tabindex="0"
        >
          <div class="resize-line" aria-hidden="true"></div>
        </div>

        <section class="pane preview-pane" id="previewPane" aria-labelledby="previewHeading">
          <header class="pane-header">
            <h2 class="pane-title" id="previewHeading">Preview</h2>
          </header>
          <article
            id="preview"
            class="preview prose"
            aria-live="polite"
            aria-label="Markdown preview"
          ></article>
        </section>
      </main>
    </div>

    <dialog class="export-dialog" id="importConfirmDialog" aria-labelledby="importConfirmTitle">
      <form method="dialog" class="export-dialog-form" id="importConfirmForm">
        <header class="export-dialog-header">
          <h2 class="export-dialog-title" id="importConfirmTitle">Replace current content?</h2>
          <p class="export-dialog-desc" id="importConfirmDesc">
            Importing will replace everything in the editor.
          </p>
        </header>
        <footer class="export-dialog-actions">
          <button
            type="button"
            class="export-dialog-btn export-dialog-btn-secondary"
            id="importConfirmCancelBtn"
          >
            Cancel
          </button>
          <button
            type="button"
            class="export-dialog-btn export-dialog-btn-primary"
            id="importConfirmReplaceBtn"
          >
            Replace
          </button>
        </footer>
      </form>
    </dialog>

    <dialog class="media-viewer" id="mediaViewerDialog" aria-label="Full size preview">
      <button
        type="button"
        class="media-viewer-close"
        id="mediaViewerClose"
        aria-label="Close full size preview"
      ></button>
      <div class="media-viewer-stage" id="mediaViewerStage"></div>
    </dialog>

    <dialog class="export-dialog" id="exportDialog" aria-labelledby="exportDialogTitle">
      <form method="dialog" class="export-dialog-form" id="exportDialogForm">
        <header class="export-dialog-header">
          <h2 class="export-dialog-title" id="exportDialogTitle">Export HTML</h2>
          <p class="export-dialog-desc">
            Download a self-contained HTML file with the same styles and rendered content.
          </p>
        </header>

        <div class="export-dialog-field">
          <label class="export-dialog-label" for="exportFilename">Filename</label>
          <input
            type="text"
            id="exportFilename"
            class="export-dialog-input"
            value="export"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="export-dialog-field">
          <label class="export-dialog-label" for="exportTheme">Theme</label>
          <select id="exportTheme" class="export-dialog-select">
            <option value="current" selected>Current theme</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>

        <div class="export-dialog-field export-dialog-checkbox-field">
          <label class="export-dialog-checkbox-label">
            <input type="checkbox" id="exportEmbedImages" checked />
            <span>Embed images as base64</span>
          </label>
        </div>

        <footer class="export-dialog-actions">
          <button
            type="button"
            class="export-dialog-btn export-dialog-btn-secondary"
            id="exportCancelBtn"
          >
            Cancel
          </button>
          <button
            type="button"
            class="export-dialog-btn export-dialog-btn-primary"
            id="exportDownloadBtn"
            data-export-download
          >
            Download
          </button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
