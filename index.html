<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="mdfor.work — A fast, private markdown editor with instant live preview. Your content stays on your device and is never sent anywhere."
    />
    <meta
      name="keywords"
      content="markdown, preview, editor, live, real-time, writing, documentation, mdfor.work"
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="mdfor.work — Instant Markdown Editor" />
    <meta
      property="og:description"
      content="A fast, private markdown editor with instant live preview. Your content stays on your device and is never sent anywhere."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mdfor.work/" />
    <link rel="canonical" href="https://mdfor.work/" />
    <meta property="og:site_name" content="mdfor.work" />
    <meta property="og:image" content="https://mdfor.work/og-image.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mdfor.work — Instant Markdown Editor" />
    <meta
      name="twitter:description"
      content="A fast, private markdown editor with instant live preview. Your content stays on your device and is never sent anywhere."
    />
    <meta name="twitter:image" content="https://mdfor.work/og-image.png" />

    <title>mdfor.work — Instant Markdown Editor</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <!-- Highlight.js -->
    <link
      id="hljs-theme-light"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css"
    />
    <link
      id="hljs-theme-dark"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css"
      disabled
    />
    <script
      src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"
      defer
    ></script>

    <!-- KaTeX for math rendering -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
      crossorigin="anonymous"
    />

    <!-- Mermaid.js for diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.10/lib/index.umd.js"
      defer
    ></script>
    <script src="app.js" defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "mdfor.work",
        "url": "https://mdfor.work/",
        "description": "A fast, private markdown editor with instant live preview. Content stays on your device and is never sent anywhere.",
        "applicationCategory": "Productivity",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

  </head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <div class="app">
      <header class="header">
        <div class="logo-container">
          <svg
            class="logo-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
            <polyline points="14 2 14 8 20 8" />
            <path d="M9 13v-1h6v1" />
            <path d="M12 12v6" />
            <path d="M11 18h2" />
          </svg>
          <h1 class="logo">mdfor.work</h1>
        </div>

        <div class="header-controls" role="group" aria-label="Editor controls">
          <nav class="mobile-view-switcher" id="mobileViewSwitcher" aria-label="Toggle view">
            <button class="view-tab active" data-view="editor" aria-pressed="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
              </svg>
              <span class="view-tab-label">Editor</span>
            </button>
            <button class="view-tab" data-view="preview" aria-pressed="false">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span class="view-tab-label">Preview</span>
            </button>
          </nav>
          <button
            class="scroll-sync-toggle"
            id="scrollSyncToggle"
            aria-label="Toggle scroll sync"
            title="Sync scrolling (off)"
            aria-pressed="false"
          >
            <!-- Link icon (synced) -->
            <svg
              class="sync-icon synced-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <!-- Unlink icon (not synced) -->
            <svg
              class="sync-icon unsynced-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M18.84 12.25l1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"
              ></path>
              <path
                d="M5.17 11.75l-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"
              ></path>
              <line x1="8" y1="2" x2="8" y2="5"></line>
              <line x1="2" y1="8" x2="5" y2="8"></line>
              <line x1="16" y1="19" x2="16" y2="22"></line>
              <line x1="19" y1="16" x2="22" y2="16"></line>
            </svg>
          </button>
          <button
            class="lint-toggle"
            id="lintToggle"
            aria-label="Toggle markdown linting"
            title="Lint markdown (off)"
            aria-pressed="false"
          >
            <!-- Warning/Check icon -->
            <svg
              class="lint-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
              ></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span class="lint-count" id="lintCount" aria-live="polite"></span>
          </button>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <!-- Sun Icon -->
            <svg
              class="theme-icon light-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon Icon -->
            <svg
              class="theme-icon dark-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="editor-container" id="mainContent">
        <section class="pane editor-pane" id="editorPane" aria-labelledby="editorHeading">
          <header class="pane-header">
            <h2 class="pane-title" id="editorHeading">Markdown</h2>
            <button class="collapse-btn" id="collapseEditor" aria-label="Collapse editor">
              <svg
                class="collapse-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
          </header>
          <div class="lint-panel" id="lintPanel" aria-live="polite" role="log">
            <ul class="lint-list" id="lintList"></ul>
          </div>
          <div class="field">
            <label class="sr-only" for="editor">Markdown input</label>
            <p class="sr-only" id="editorDescription">
              Type markdown to see a live preview alongside.
            </p>
            <div class="editor-wrapper">
              <div class="line-gutter" id="lineGutter" aria-hidden="true"></div>
              <textarea
                id="editor"
                class="editor"
                placeholder="Start writing..."
                spellcheck="true"
                aria-describedby="editorDescription"
              ></textarea>
            </div>
          </div>
        </section>

        <div
          class="resize-handle"
          id="resizeHandle"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize editor and preview panes"
          tabindex="0"
        >
          <div class="resize-line" aria-hidden="true"></div>
        </div>

        <section class="pane preview-pane" id="previewPane" aria-labelledby="previewHeading">
          <header class="pane-header">
            <h2 class="pane-title" id="previewHeading">Preview</h2>
          </header>
          <article
            id="preview"
            class="preview prose"
            aria-live="polite"
            aria-label="Markdown preview"
          ></article>
        </section>
      </main>
    </div>
  </body>
</html>
