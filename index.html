<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="mdfor.work — A fast, private markdown editor with instant live preview. Write and see your formatted document in real-time."
    />
    <meta
      name="keywords"
      content="markdown, preview, editor, live, real-time, writing, documentation, mdfor.work"
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="mdfor.work — Instant Markdown Editor" />
    <meta
      property="og:description"
      content="A fast, private markdown editor with instant live preview. Write and see your formatted document in real-time."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mdfor.work" />
    <meta property="og:site_name" content="mdfor.work" />
    <meta property="og:image" content="https://mdfor.work/og-image.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mdfor.work — Instant Markdown Editor" />
    <meta
      name="twitter:description"
      content="A fast, private markdown editor with instant live preview. Write and see your formatted document in real-time."
    />
    <meta name="twitter:image" content="https://mdfor.work/og-image.png" />

    <title>mdfor.work — Instant Markdown Editor</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <!-- Highlight.js for syntax highlighting (full bundle with common languages) -->
    <link
      id="hljs-theme-light"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css"
    />
    <link
      id="hljs-theme-dark"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css"
      disabled
    />
    <script
      src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"
      defer
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="logo">mdfor.work</h1>
        <div class="mobile-view-switcher" id="mobileViewSwitcher">
          <button class="view-tab active" data-view="editor" aria-label="Show editor">
            <span class="view-tab-icon">✏️</span>
            <span class="view-tab-label">Editor</span>
          </button>
          <button class="view-tab" data-view="preview" aria-label="Show preview">
            <span class="view-tab-icon">👁️</span>
            <span class="view-tab-label">Preview</span>
          </button>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon light-icon">☀️</span>
          <span class="theme-icon dark-icon">🌙</span>
        </button>
      </header>

      <main class="editor-container">
        <section class="pane editor-pane" id="editorPane">
          <div class="pane-header">
            <span class="pane-title">Editor</span>
            <button class="collapse-btn" id="collapseEditor" aria-label="Collapse editor">
              <span class="collapse-icon">◀</span>
            </button>
          </div>
          <textarea
            id="editor"
            class="editor"
            placeholder="Start writing your markdown here..."
            spellcheck="true"
            autofocus
          ></textarea>
        </section>

        <div class="resize-handle" id="resizeHandle">
          <div class="resize-line"></div>
        </div>

        <section class="pane preview-pane" id="previewPane">
          <div class="pane-header">
            <span class="pane-title">Preview</span>
          </div>
          <article id="preview" class="preview prose"></article>
        </section>
      </main>
    </div>
  </body>
</html>
