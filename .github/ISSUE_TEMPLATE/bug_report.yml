name: Bug report
description: Something renders wrong, breaks, or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste the markdown below into the editor
        2. Click Export → Download .pdf
        3. ...
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Markdown sample
      description: The smallest snippet that reproduces the problem, if relevant.
      render: markdown
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS 26
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
