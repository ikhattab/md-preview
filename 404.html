<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | mdfor.dev</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f1;
        --text: #1b1916;
        --muted: #6b645a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1916;
          --text: #f2ede4;
          --muted: #a39b8e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      p {
        color: var(--muted);
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There's nothing at this address.</p>
      <p><a href="/">Open the markdown editor</a></p>
    </main>
  </body>
</html>
